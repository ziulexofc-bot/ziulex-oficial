<!DOCTYPE html>
<html lang="en">
<head>

<!-- ZIULEX V4 PROFISSIONAL - SYNC AUTOMATICO TOTAL -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.42.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
  const SB_URL="https://bfqkcsgdnpxrwkyupls.supabase.co";
  const SB_KEY="sb_publishable_5NeAhUNLMZ-UNya14PT_Tw_G9Q4qx0F";
  // Salva permanente
  localStorage.setItem('ziulex_supabase_url', SB_URL);
  localStorage.setItem('ziulex_supabase_key', SB_KEY);
  
  const client = supabase.createClient(SB_URL, SB_KEY);
  window.ziulexSupabase = client;
  console.log('✅ ZIULEX PROFISSIONAL CONECTADO - SYNC AUTOMATICO ATIVO');

  // --- UPLOAD AUTOMATICO ---
  async function autoUpload(table, obj) {
    if(!obj?.id) return;
    const map = {
      clientes: {id:String(obj.id), nome:obj.nome||obj.name||'', cpf:obj.cpf||'', email:obj.email||'', telefone:obj.telefone||obj.phone||'', escritorio:obj.escritorio||'Matriz'},
      processos: {id:String(obj.id), cnj:obj.cnj||'', cliente_nome:obj.cliente||obj.cliente_nome||'', status:obj.status||'Ativo', escritorio:'Matriz'},
      agenda: {id:String(obj.id), titulo:obj.titulo||obj.title||'', data:obj.data||new Date().toISOString().slice(0,10), hora:obj.hora||'', tipo:obj.tipo||'', cliente_nome:obj.cliente||''},
      financeiro: {id:String(obj.id), cliente_nome:obj.cliente||obj.cliente_nome||'Geral', descricao:obj.descricao||'', valor:Number(obj.valor||0), vencimento:obj.vencimento||new Date().toISOString().slice(0,10), status:obj.status||'Pendente', tipo:obj.tipo||'Receita'}
    }[table];
    if(!map) return;
    const {error} = await client.from(table).upsert(map, {onConflict:'id'});
    if(error) console.error('Erro autoUpload', table, error);
    else console.log('☁️ Auto-sync up:', table, map.nome||map.titulo||map.id);
  }

  // --- DOWNLOAD AUTOMATICO ---
  async function autoDownload() {
    try {
      const {data} = await client.from('clientes').select('*').limit(200);
      if(!data?.length) return;
      let local = JSON.parse(localStorage.getItem('ziulex_clientes')||'[]');
      const localIds = new Set(local.map(x=>String(x.id)));
      let changed = false;
      // Adiciona novos do cloud
      data.forEach(d=>{
        if(!localIds.has(String(d.id))) {
          local.push({id:d.id, nome:d.nome, name:d.nome, cpf:d.cpf, email:d.email, telefone:d.telefone, phone:d.telefone, escritorio:d.escritorio});
          changed = true;
        }
      });
      // Atualiza existentes se nome mudou no cloud (tempo real)
      data.forEach(d=>{
        const idx = local.findIndex(x=>String(x.id)===String(d.id));
        if(idx>=0 && local[idx].nome!==d.nome) { local[idx].nome=d.nome; local[idx].name=d.nome; changed=true; }
      });
      if(changed) {
        localStorage.setItem('ziulex_clientes', JSON.stringify(local));
        // Força recarregar lista se a função existir no seu ziulex
        try { if(window.renderClientes) window.renderClientes(); if(window.carregarClientes) window.carregarClientes(); } catch{}
        console.log('☁️ Auto-sync down:', data.length, 'clientes sincronizados');
      }
    } catch(e){ console.error(e); }
  }

  // Intercepta qualquer salvamento - 100% automático
  const origSet = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(k,v){
    origSet(k,v);
    if(['ziulex_clientes','ziulex_processos','ziulex_agenda','ziulex_financeiro'].includes(k)) {
      try {
        const arr = JSON.parse(v);
        if(Array.isArray(arr) && arr.length) {
          const last = arr[arr.length-1];
          const tableMap = {'ziulex_clientes':'clientes','ziulex_processos':'processos','ziulex_agenda':'agenda','ziulex_financeiro':'financeiro'};
          if(last?.id) autoUpload(tableMap[k], last);
          // Se for array inteiro novo (edição), sobe todos em background
          if(arr.length>1 && k==='ziulex_clientes') {
            arr.slice(-5).forEach(c=>autoUpload('clientes', c));
          }
        }
      } catch{}
    }
  };

  // Realtime - quando outro dispositivo salva, baixa na hora
  try {
    client.channel('ziulex-realtime-v4')
      .on('postgres_changes', {event:'*', schema:'public', table:'clientes'}, ()=>{ console.log('🔴 Realtime: outro dispositivo alterou clientes'); autoDownload(); })
      .on('postgres_changes', {event:'*', schema:'public', table:'processos'}, ()=>autoDownload())
      .subscribe();
    console.log('🔴 Realtime ativo - sync instantâneo');
  } catch(e){ console.log('Realtime fallback para polling'); }

  // Polling de segurança a cada 3s + inicial
  setTimeout(autoDownload, 1500);
  setInterval(autoDownload, 3000);
  
  // Auto-upload de dados antigos que ainda não foram pra nuvem (primeira vez)
  setTimeout(async ()=>{
    try {
      const local = JSON.parse(localStorage.getItem('ziulex_clientes')||'[]');
      if(local.length) {
        console.log('☁️ Enviando', local.length, 'clientes locais para nuvem (primeira sync)...');
        for(let c of local.slice(0,50)) await autoUpload('clientes', c);
      }
    } catch{}
  }, 3000);
})();
</script>
<!-- FIM SYNC PROFISSIONAL -->

(function(){
  const SECURE=['ziulex_processos','ziulex_clientes','ziulex_financeiro','ziulex_documentos','ziulex_agenda'];
  const oGet=localStorage.getItem.bind(localStorage);

  localStorage.setItem=function(k,v){ if(internal) return oSet(k,v); if(SECURE.includes(k)){ try{ internal=true; let allowed=ZCore.getAllowed(); if(!allowed.includes('todos')&&v){ try{ let p=JSON.parse(v); if(Array.isArray(p)){ let proib=p.filter(it=>{ let esc=it.escritorio; if(!esc) return false; return !allowed.includes(esc); }); if(proib.length>0){ let fil=p.filter(it=>{ let esc=it.escritorio; if(!esc) return true; return allowed.includes(esc)||esc===''; }); v=JSON.stringify(fil); } } }catch{} } internal=false; return oSet(k,v); }catch{ internal=false; return oSet(k,v); } } return oSet(k,v); };

async function extrairPDF(dataURL){ try{ if(!window.pdfjsLib) return ''; let pdf=await pdfjsLib.getDocument(dataURL).promise; let txt=''; for(let i=1;i<=Math.min(pdf.numPages,10);i++){ let page=await pdf.getPage(i); let content=await page.getTextContent(); txt+=content.items.map(it=> it.str).join(' ')+'\n'; } return txt; }catch{ return ''; } }
async function extrairIMG(dataURL){ try{ if(!window.Tesseract) return ''; let r=await Tesseract.recognize(dataURL,'por+eng'); return r.data.text||''; }catch{ return ''; } }
document.addEventListener('change', async (e)=>{
  let input=e.target; if(input.type==='file'&&input.files&&input.files.length>0){
    let file=input.files[0]; if(/\.(pdf|jpg|jpeg|png)$/i.test(file.name)){
      let prog=document.createElement('div'); prog.style.cssText='position:fixed; bottom:20px; left:20px; z-index:99999; background:#111827; color:white; padding:10px 16px; border-radius:8px; font-size:12px;'; prog.textContent='Processando: '+file.name; document.body.appendChild(prog);
      let reader=new FileReader(); reader.onload=async (ev)=>{ let dataURL=ev.target.result; let texto=''; if(file.name.toLowerCase().endsWith('.pdf')) texto=await extrairPDF(dataURL); else texto=await extrairIMG(dataURL); window._zm_last_ocr_text=texto; prog.textContent=texto?`Processado: ${texto.length} caracteres`:`Falha no processamento`; setTimeout(()=> prog.remove(),4000); }; reader.readAsDataURL(file);
    }
  }
});

// 5. FINANCEIRO COMPLETO - PARCELAMENTO + PIX + DRE + COBRANÇA REAL
(function(){
  const COB_KEY='ziulex_cobranca_automatica_config';
  function getCobConfig(){
    try{
      let cfg=JSON.parse(localStorage.getItem(COB_KEY)||'null');
      if(!cfg){
        cfg={ativo:true, automaticoReal:false, horario:'08:00', mensagemPadrao:'Prezado(a) {cliente}, informamos que o pagamento referente a {descricao}, no valor de R$ {valor}, possui vencimento em {data}. Chave Pix: {pixChave}. Solicitamos confirmação. Atenciosamente, Zaidan Advogados.', pixChave:localStorage.getItem('ziulex_pix_chave')||'', evolution:{ativo:false, url:'', apiKey:'', instancia:''}, cobrarAtrasados:true, diasAtrasadosMax:30};
        localStorage.setItem(COB_KEY, JSON.stringify(cfg));
      }
      return cfg;
    }catch{ return {ativo:true, automaticoReal:false, horario:'08:00', mensagemPadrao:'', pixChave:'', evolution:{ativo:false}}; }
  }
  function getCobLog(){ try{ return JSON.parse(localStorage.getItem('ziulex_cobranca_log')||'[]'); }catch{ return []; } }
  function jaCobrouHoje(cid,fid){ let logs=getCobLog(); let hoje=new Date().toISOString().slice(0,10); return logs.some(l=> l.data===hoje && String(l.clienteId)===String(cid) && String(l.financeiroId)===String(fid)); }
  function registrarCob(cid,fid,tipo,status,det){ try{ let logs=getCobLog(); logs.push({data:new Date().toISOString().slice(0,10), dataHora:new Date().toISOString(), clienteId:cid, financeiroId:fid, tipo:tipo||'automatico', status:status||'enviado', detalhes:det||''}); if(logs.length>1000) logs=logs.slice(-1000); localStorage.setItem('ziulex_cobranca_log', JSON.stringify(logs)); }catch{} }

  async function executarCobrancaReal(manual=false){
    let cfg=getCobConfig(); if(!cfg.ativo) return {executado:false}; if(!cfg.automaticoReal&&!manual) return {executado:false};
    let fin=ZCore.getFin(); let clis=ZCore.getClis(); let hoje=new Date(); hoje.setHours(0,0,0,0);
    let paraCobrar=[];
    fin.forEach(item=>{
      let venc=item.vencimento||item.dataVencimento||item.data; if(!venc) return; if((item.status||'').toLowerCase().includes('pago')) return; if(item.cobrancaAutomatica===false) return; if(!item.clienteId) return; if(jaCobrouHoje(item.clienteId,item.id)) return;
      let cli=clis.find(c=> String(c.id)===String(item.clienteId)); if(!cli) return; if(cli.permiteCobrancaAutomatica===false) return;
      let dv=new Date(venc); dv.setHours(0,0,0,0); if(isNaN(dv.getTime())) return; let diff=Math.floor((dv-hoje)/(1000*60*60*24));
      let deve=false; if(diff===0) deve=true; else if(cfg.cobrarAtrasados&&diff<0&&Math.abs(diff)<=cfg.diasAtrasadosMax) deve=true;
      if(deve) paraCobrar.push({financeiro:item, cliente:cli, diasAtraso:diff<0?Math.abs(diff):0});
    });
    if(paraCobrar.length===0) return {executado:true,total:0,enviados:0};
    let enviados=0;
    for(let item of paraCobrar){
      let tel=(item.cliente.telefone||item.cliente.whatsapp||item.cliente.celular||'').replace(/\D/g,''); if(tel.length<10) continue; if(tel.length===10||tel.length===11) tel='55'+tel;
      let msg=cfg.mensagemPadrao.replace('{cliente}',item.cliente.nome.split(' ')[0]).replace('{descricao}',item.financeiro.descricao||'').replace('{valor}',item.financeiro.valor||'').replace('{data}',item.financeiro.vencimento||'').replace('{pixChave}',cfg.pixChave||'');
      if(item.diasAtraso>0) msg=`Prezado(a) ${item.cliente.nome.split(' ')[0]}, pagamento referente a ${item.financeiro.descricao} R$ ${item.financeiro.valor} em atraso há ${item.diasAtraso} dias. Pix: ${cfg.pixChave}. Atenciosamente, Zaidan Advogados.`;
      let sucesso=false;
      if(cfg.evolution.ativo&&cfg.evolution.url){
        try{ let url=cfg.evolution.url.replace(/\/$/,'')+`/message/sendText/${cfg.evolution.instancia}`; let resp=await fetch(url,{method:'POST', headers:{'Content-Type':'application/json','apikey':cfg.evolution.apiKey}, body:JSON.stringify({number:tel, textMessage:{text:msg}})}); sucesso=resp.ok; }catch{ sucesso=false; }
      } else if(manual){ window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`,'_blank'); sucesso=true; await new Promise(r=>setTimeout(r,2000)); }
      if(sucesso){ enviados++; registrarCob(item.cliente.id,item.financeiro.id,'automatico','enviado',tel); } else { registrarCob(item.cliente.id,item.financeiro.id,'automatico','erro','falha'); }
      await new Promise(r=>setTimeout(r,1500));
    }
    let toast=document.createElement('div'); toast.style.cssText='position:fixed; bottom:20px; right:20px; z-index:99999; background:#111827; color:white; padding:14px 20px; border-radius:8px;'; toast.innerHTML=`<p style="font-weight:600; font-size:13px;">Cobrança automática executada - ${enviados} enviadas</p>`; document.body.appendChild(toast); setTimeout(()=> toast.remove(),6000);
    return {executado:true,total:paraCobrar.length,enviados};
  }
  function verificarHorario(){
    let cfg=getCobConfig(); if(!cfg.ativo||!cfg.automaticoReal) return; let agora=new Date(); let [h,m]=(cfg.horario||'08:00').split(':').map(Number); let hojeStr=agora.toISOString().slice(0,10); let ja=localStorage.getItem(`ziulex_cobranca_auto_executada_${hojeStr}`); if(ja) return; if(agora.getHours()===h&&agora.getMinutes()>=m&&agora.getMinutes()<m+5){ localStorage.setItem(`ziulex_cobranca_auto_executada_${hojeStr}`,new Date().toISOString()); executarCobrancaReal(false); }
  }

  // PARCELAMENTO
  function injetarParcelamento(){

        let btnArea=modal.querySelector('.flex.gap-3.pt-4')||modal.querySelector('div.flex.justify-end'); if(btnArea) btnArea.parentNode.insertBefore(w,btnArea); else modal.appendChild(w);
        let qtdSel=w.querySelector('#zm-parc-qtd'); let intSel=w.querySelector('#zm-parc-intervalo'); let preview=w.querySelector('#zm-parc-preview'); let lista=w.querySelector('#zm-parc-lista');
        function atualizar(){ let qtd=parseInt(qtdSel.value)||1; let valorTotal=parseFloat(valorInput.value)||0; if(qtd<=1||valorTotal<=0){ preview.classList.add('hidden'); return; } preview.classList.remove('hidden'); let valorParc=valorTotal/qtd; let vencBase=modal.querySelector('input[type="date"]')?.value||new Date().toISOString().slice(0,10); let intervalo=parseInt(intSel.value)||30; let html=''; for(let i=0;i<qtd;i++){ let data=new Date(vencBase); data.setDate(data.getDate()+(i*intervalo)); let dataStr=data.toLocaleDateString('pt-BR'); html+=`<div class="flex justify-between text-[11px] p-2 rounded bg-[#F9FAFB] border"><span>Parcela ${i+1}/${qtd} - ${dataStr}</span><span class="font-semibold">R$ ${valorParc.toFixed(2)}</span></div>`; } lista.innerHTML=html; }
        qtdSel.addEventListener('change',atualizar); intSel.addEventListener('change',atualizar); valorInput.addEventListener('input',atualizar);
      }
    });
  }
  document.addEventListener('click', (e)=>{
    let btn=e.target.closest('button'); if(!btn) return; if((btn.textContent.includes('Salvar')||btn.textContent.includes('Confirmar'))&&document.getElementById('zm-parcelamento')){
      let qtdSel=document.getElementById('zm-parc-qtd'); if(qtdSel&&parseInt(qtdSel.value)>1){
        let qtd=parseInt(qtdSel.value); let intervalo=parseInt(document.getElementById('zm-parc-intervalo')?.value||'30');

      }
    }
  }, true);

t-2"><input type="text" id="zm-evo-url" value="${cfg.evolution.url}" placeholder="URL Evolution" class="h-8 px-2 rounded border bg-white text-[11px]"><input type="text" id="zm-evo-key" value="${cfg.evolution.apiKey}" placeholder="API Key" class="h-8 px-2 rounded border bg-white text-[11px]"><input type="text" id="zm-evo-inst" value="${cfg.evolution.instancia}" placeholder="Instância" class="h-8 px-2 rounded border bg-white text-[11px]"></div><label class="flex items-center gap-2 mt-2 text-[11px]"><input type="checkbox" id="zm-evo-ativo" ${cfg.evolution.ativo?'checked':''}> Ativar envio automático via API</label></div><div class="mt-3 flex gap-2"><button id="zm-cob-salvar" class="h-9 px-4 rounded-[8px] bg-[#111827] text-white text-[12px] font-medium">Salvar Configurações</button><button id="zm-cob-testar" class="h-9 px-4 rounded-[8px] bg-white border text-[12px]">Executar Teste</button></div>`;

      dash.innerHTML=`<div class="bg-[#111827] rounded-[12px] p-6 text-white mb-4"><div class="flex justify-between"><div><h1 class="text-[18px] font-semibold">Bom dia, ${nome}.</h1><p class="text-[12px] text-white/60 mt-1">${hoje.toLocaleDateString('pt-BR', {weekday:'long', day:'numeric', month:'long'})} • ${total} pendências para hoje</p></div><div class="flex gap-2"><div class="px-3 py-2 rounded-[8px] bg-white/10 text-center"><p class="font-semibold">${agendaHoje.length}</p><p class="text-[9px] opacity-60">Compromissos</p></div><div class="px-3 py-2 rounded-[8px] bg-white/10 text-center"><p class="font-semibold">${atrasadas.length}</p><p class="text-[9px] opacity-60">Pendências</p></div></div></div></div><div class="grid grid-cols-1 lg:grid-cols-3 gap-4"><div class="lg:col-span-2 bg-white border border-[#E5E7EB] rounded-[12px] p-5"><h3 class="font-semibold text-[12px]">Compromissos do Dia (${agendaHoje.length})</h3><div class="mt-3 space-y-2 max-h-[250px] overflow-auto">${agendaHoje.length===0?`<p class="text-center py-6 text-[12px] text-[#6B7280]">Nenhum compromisso agendado</p>`:agendaHoje.map(a=>`<div class="p-3 rounded-[8px] bg-[#F9FAFB] border"><p class="text-[11px] font-medium">${a.tipo||''} - ${a.titulo||''}</p><p class="text-[10px] text-[#6B7280]">${a.horaInicio||''} ${a.local||''}</p></div>`).join('')}</div></div><div class="bg-white border border-[#E5E7EB] rounded-[12px] p-5"><h3 class="font-semibold text-[12px]">Cobranças Pendentes (${cobrancasHoje.length+atrasadas.length})</h3><div class="mt-3 space-y-2">${atrasadas.slice(0,3).map(f=>`<div class="p-2 rounded-[8px] bg-[#FEF2F2] border border-[#FECACA] flex justify-between"><div><p class="text-[11px] font-medium">${f.descricao}</p><p class="text-[9px] text-[#6B7280]">Em atraso</p></div><p class="text-[11px] font-semibold">R$ ${f.valor}</p></div>`).join('')}${cobrancasHoje.slice(0,3).map(f=>`<div class="p-2 rounded-[8px] bg-[#F9FAFB] border flex justify-between"><div><p class="text-[11px] font-medium">${f.descricao}</p><p class="text-[9px]">Vencimento hoje</p></div><p class="text-[11px] font-semibold">R$ ${f.valor}</p></div>`).join('')}${cobrancasHoje.length===0&&atrasadas.length===0?`<p class="text-[11px] text-[#6B7280] text-center py-4">Nenhuma cobrança pendente</p>`:''}</div><div class="mt-3 p-3 rounded-[8px] bg-[#111827] text-white flex justify-between"><div><p class="text-[10px] opacity-60">Valor Total</p><p class="font-semibold">R$ ${(cobrancasHoje.reduce((s,f)=> s+(parseFloat(f.valor)||0),0)+atrasadas.reduce((s,f)=> s+(parseFloat(f.valor)||0),0)).toFixed(2)}</p></div></div></div></div></div>`;
      let stats=document.querySelector('div.grid.grid-cols-1.md\:grid-cols-2.lg\:grid-cols-4')||main.firstElementChild; if(stats&&stats.parentNode) stats.parentNode.insertBefore(dash,stats); else main.prepend(dash);
    }catch{}
  }
  setInterval(injetarDashboard,3000); setTimeout(injetarDashboard,1000);
})();

// 7. CHECKLIST DO DIA PROFISSIONAL
(function(){
  function getCheckKey(){ let hoje=new Date().toISOString().slice(0,10); let uid=ZCore.getUser()?.email||'default'; return `ziulex_checklist_${hoje}_${uid}`; }
  function getChecklist(){ try{ return JSON.parse(localStorage.getItem(getCheckKey())||'[]'); }catch{ return []; } }
  function saveChecklist(l){ localStorage.setItem(getCheckKey(), JSON.stringify(l)); }
  function gerarChecklist(){
    let existente=getChecklist();
    let agenda=ZCore.getAgenda(); let fin=ZCore.getFin(); let hojeStr=new Date().toISOString().slice(0,10);
    let hojeAgenda=agenda.filter(a=> (a.data||a.dataInicio||'').slice(0,10)===hojeStr);
    let cobrancas=fin.filter(f=>{ let venc=f.vencimento||''; if(!venc) return false; if((f.status||'').toLowerCase().includes('pago')) return false; return venc.slice(0,10)===hojeStr || new Date(venc)<new Date().setHours(0,0,0,0); });
    let novas=[];
    hojeAgenda.forEach(a=>{
      let id=`agenda_${a.id}`; if(!existente.find(c=> c.id===id)){
        novas.push({id, titulo:a.titulo||a.descricao||'Compromisso', descricao:`${a.horaInicio||''} ${a.local||''}`.trim(), feito:false, tipo:a.tipo||'Compromisso', prioridade:(a.tipo||'').toLowerCase().includes('perícia')?'alta':'media'});
      }
    });
    cobrancas.slice(0,5).forEach(f=>{
      let id=`cobranca_${f.id}`; if(!existente.find(c=> c.id===id)){
        novas.push({id, titulo:`Cobrança - ${f.descricao}`, descricao:`R$ ${f.valor} - Venc: ${f.vencimento}`, feito:false, tipo:'Cobrança', prioridade:'alta'});
      }
    });
    if(existente.length===0&&novas.length===0){
      novas.push({id:'manual_1', titulo:'Revisar processos pendentes', descricao:'Verificar movimentações', feito:false, tipo:'Administrativo', prioridade:'media'});
    }
    let final=[...existente, ...novas];
    saveChecklist(final);
    return final;
  }
  function injetarChecklist(){
    if(document.getElementById('zm-checklist-dia')) return;
    if(!document.getElementById('zm-dashboard-acionavel')) return;
    let lista=gerarChecklist();
    let concluidas=lista.filter(i=> i.feito).length; let total=lista.length; let progresso=total>0?Math.round((concluidas/total)*100):0;
    let dash=document.getElementById('zm-dashboard-acionavel');
    let div=document.createElement('div'); div.id='zm-checklist-dia'; div.className='mt-6 bg-white border border-[#E5E7EB] rounded-[12px] p-6';
    div.innerHTML=`<div class="flex justify-between items-start mb-4"><div class="flex gap-3"><div class="w-10 h-10 rounded-[8px] bg-[#111827] text-white flex items-center justify-center text-[14px]">C</div><div><h3 class="font-semibold text-[13px]">Checklist do Dia - ${concluidas}/${total} • ${progresso}%</h3><p class="text-[11px] text-[#6B7280] mt-1">Controle de tarefas diárias com salvamento automático</p><div class="mt-2 w-[250px] h-2 bg-[#F3F4F6] rounded-full overflow-hidden"><div class="h-full bg-[#111827] transition-all" style="width:${progresso}%"></div></div></div></div><div class="flex gap-2"><button id="zm-check-add" class="h-9 px-4 rounded-[8px] bg-white border border-[#E5E7EB] text-[11px] font-medium">Nova Tarefa</button><button id="zm-check-clear" class="h-9 px-4 rounded-[8px] bg-[#FEF2F2] border border-[#FECACA] text-[#DC2626] text-[11px]">Remover Concluídas</button></div></div><div class="space-y-2 max-h-[350px] overflow-auto">${lista.length===0?`<p class="text-center py-8 text-[12px] text-[#6B7280]">Nenhuma tarefa para hoje</p>`:lista.map((item,idx)=>`<div class="flex gap-3 p-3 rounded-[8px] border ${item.feito?'border-[#BBF7D0] bg-[#F0FDF4] opacity-75':'border-[#E5E7EB] bg-white'}"><label class="flex gap-3 flex-1 cursor-pointer"><input type="checkbox" ${item.feito?'checked':''} data-idx="${idx}" class="zm-check-input mt-0.5 w-4 h-4 rounded"><div class="flex-1"><p class="text-[12px] font-medium ${item.feito?'line-through text-[#6B7280]':''}">${item.titulo} ${item.prioridade==='alta'?'<span class="ml-2 px-1.5 py-0.5 rounded bg-[#DC2626] text-white text-[8px]">PRIORITÁRIO</span>':''}</p><p class="text-[11px] text-[#6B7280] mt-1 ${item.feito?'line-through':''}">${item.descricao}</p><p class="text-[10px] text-[#9CA3AF] mt-1">${item.tipo}</p></div></label><button data-del="${idx}" class="zm-del w-6 h-6 rounded bg-white border text-[12px]">×</button></div>`).join('')}</div>${total>0?`<div class="mt-4 p-3 rounded-[8px] bg-[#F9FAFB] border border-[#E5E7EB] flex justify-between items-center"><div><p class="text-[11px] font-medium">${progresso===100?'Todas as tarefas concluídas':`${total-concluidas} tarefas pendentes`}</p><p class="text-[10px] text-[#6B7280]">Progresso salvo automaticamente</p></div><button id="zm-check-reset" class="h-8 px-3 rounded-[6px] bg-white border text-[11px]">Reiniciar</button></div>`:''}</div>`;
    dash.parentNode.insertBefore(div, dash.nextSibling);
    div.querySelectorAll('.zm-check-input').forEach(inp=>{ inp.addEventListener('change',(e)=>{ let idx=parseInt(e.target.getAttribute('data-idx')); let lista=getChecklist(); if(lista[idx]){ lista[idx].feito=e.target.checked; lista[idx].concluidoEm=e.target.checked?new Date().toISOString():null; saveChecklist(lista); div.remove(); setTimeout(injetarChecklist,100); } }); });
    div.querySelectorAll('[data-del]').forEach(btn=>{ btn.addEventListener('click',(e)=>{ let idx=parseInt(e.currentTarget.getAttribute('data-del')); let lista=getChecklist(); lista.splice(idx,1); saveChecklist(lista); div.remove(); setTimeout(injetarChecklist,100); }); });
    div.querySelector('#zm-check-add')?.addEventListener('click',()=>{ let t=prompt('Título da tarefa:'); if(!t) return; let d=prompt('Descrição:')||''; let lista=getChecklist(); lista.push({id:`manual_${Date.now()}`, titulo:t, descricao:d, feito:false, tipo:'Manual', prioridade:'media'}); saveChecklist(lista); div.remove(); setTimeout(injetarChecklist,100); });
    div.querySelector('#zm-check-clear')?.addEventListener('click',()=>{ let lista=getChecklist(); let f=lista.filter(i=> !i.feito); saveChecklist(f); div.remove(); setTimeout(injetarChecklist,100); });
    div.querySelector('#zm-check-reset')?.addEventListener('click',()=>{ if(confirm('Reiniciar checklist do dia?')){ localStorage.removeItem(getCheckKey()); div.remove(); setTimeout(injetarChecklist,100); } });
  }
  setInterval(()=>{ if(document.getElementById('zm-dashboard-acionavel')&&!document.getElementById('zm-checklist-dia')) injetarChecklist(); },3000);
  setTimeout(injetarChecklist,2000);
})();

// 8. BACKUP
(function(){
  function injetarBackup(){
    if(document.getElementById('zm-backup')) return; if(!document.body.textContent.includes('Configurações')) return;
    let main=document.querySelector('main')||document.querySelector('div.flex-1'); if(!main) return;
    let div=document.createElement('div'); div.id='zm-backup'; div.className='mt-6 bg-white border border-[#E5E7EB] rounded-[12px] p-6';
    let ultimo=localStorage.getItem('ziulex_ultimo_backup');
    div.innerHTML=`<div class="flex gap-3"><div class="w-10 h-10 rounded-[8px] bg-[#111827] text-white flex items-center justify-center">B</div><div><h3 class="font-semibold text-[13px]">Backup e Restauração</h3><p class="text-[11px] text-[#6B7280]">Último: ${ultimo?new Date(ultimo).toLocaleString('pt-BR'):'Nenhum'}</p></div></div><div class="mt-4 flex gap-2"><button id="zm-backup-agora" class="h-9 px-4 rounded-[8px] bg-[#111827] text-white text-[11px] font-medium">Gerar Backup</button><button id="zm-backup-restaurar" class="h-9 px-4 rounded-[8px] bg-white border text-[11px]">Restaurar Dados</button></div>`;
    let target=document.querySelector('div.space-y-6')||main; target.appendChild(div);
    div.querySelector('#zm-backup-agora').addEventListener('click',()=>{ let dados={}; for(let i=0;i<localStorage.length;i++){ let k=localStorage.key(i); if(k&&k.startsWith('ziulex_')){ try{ dados[k]=JSON.parse(localStorage.getItem(k)); }catch{ dados[k]=localStorage.getItem(k); } } } let blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`ziulex-backup-${new Date().toISOString().slice(0,10)}.json`; a.click(); localStorage.setItem('ziulex_ultimo_backup', new Date().toISOString()); alert('Backup gerado'); });
    div.querySelector('#zm-backup-restaurar').addEventListener('click',()=>{ let input=document.createElement('input'); input.type='file'; input.accept='.json'; input.onchange=(ev)=>{ let file=ev.target.files[0]; if(!file) return; let reader=new FileReader(); reader.onload=(e)=>{ try{ let dados=JSON.parse(e.target.result); if(confirm(`Restaurar ${Object.keys(dados).length} registros?`)){ Object.keys(dados).forEach(k=>{ if(k.startsWith('ziulex_')) localStorage.setItem(k, typeof dados[k]==='string'?dados[k]:JSON.stringify(dados[k])); }); alert('Restaurado'); location.reload(); } }catch{ alert('Erro'); } }; reader.readAsText(file); }; input.click(); });
  }
  setInterval(injetarBackup,5000); setTimeout(injetarBackup,2000);
})();

// 9. LOGS RESTRITO
(function(){
  const ALLOWED=['iuri','zaidan','admin'];
  function getUser(){ try{ return JSON.parse(localStorage.getItem('ziulex_usuario_logado')||'null') || JSON.parse(localStorage.getItem('ziulex_usuarios')||'[]')[0] || null; }catch{ return null; } }
  function podeVer(){ try{ let u=getUser(); if(!u) return false; if(u.perfil==='admin'||u.role==='admin') return true; return ALLOWED.some(a=> (u.email||'').toLowerCase().includes(a)); }catch{ return false; } }
  function criarGuia(){
    if(!podeVer()) return; if(document.getElementById('zm-nav-logs')) return;
    let sidebar=document.querySelector('aside')||document.querySelector('nav'); if(!sidebar) return;
    let menuItems=sidebar.querySelectorAll('a, button'); let ultimo=null;
    for(let item of menuItems){ let txt=item.textContent||''; if(txt.includes('Configurações')||txt.includes('Usuários')) ultimo=item; }
    let nav=document.createElement('a'); nav.id='zm-nav-logs'; nav.href='#'; nav.className=ultimo?ultimo.className:''; nav.style.cssText='display:flex; align-items:center; gap:10px; padding:10px 16px; color:rgba(255,255,255,0.7); text-decoration:none; font-size:13px; border-radius:8px; margin:4px 8px;';
    nav.innerHTML=`<span style="width:20px; height:20px; background:#374151; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:11px;">L</span><span style="flex:1;">Auditoria e Registros</span><span style="font-size:9px; background:#374151; padding:2px 6px; border-radius:10px;">RESTRITO</span>`;
    if(ultimo&&ultimo.parentNode) ultimo.parentNode.insertBefore(nav, ultimo.nextSibling); else sidebar.appendChild(nav);
    nav.addEventListener('click',(e)=>{ e.preventDefault(); abrirLogs(); });
  }
  function abrirLogs(){
    if(!podeVer()){ alert('Acesso restrito a administradores'); return; }
    let main=document.querySelector('main')||document.querySelector('div.flex-1'); if(!main) return;
    let logs={cobranca:[]}; try{ logs.cobranca=JSON.parse(localStorage.getItem('ziulex_cobranca_log')||'[]'); }catch{}
    let page=document.createElement('div'); page.id='zm-logs-page'; page.className='p-6';
    page.innerHTML=`<div class="mb-6 flex justify-between"><div class="flex gap-3 items-center"><div class="w-10 h-10 rounded-[8px] bg-[#111827] text-white flex items-center justify-center">L</div><div><h1 class="text-[16px] font-semibold">Auditoria e Registros <span class="ml-2 px-2 py-0.5 rounded bg-[#374151] text-white text-[10px]">ACESSO RESTRITO</span></h1><p class="text-[11px] text-[#6B7280]">${logs.cobranca.length} registros</p></div></div><button id="zm-logs-voltar" class="h-9 px-4 rounded-[8px] bg-white border text-[12px]">Voltar</button></div><div class="bg-white border rounded-[12px] overflow-hidden"><div class="p-4 border-b bg-[#F9FAFB] flex justify-between"><p class="text-[12px] font-semibold">Registros de Cobrança Automática</p><button id="zm-log-export" class="h-8 px-3 rounded bg-white border text-[11px]">Exportar CSV</button></div><div class="max-h-[500px] overflow-auto"><table class="w-full text-[11px]"><thead class="bg-[#F9FAFB] border-b sticky top-0"><tr><th class="text-left p-3">Data</th><th class="text-left p-3">Cliente</th><th class="text-left p-3">Tipo</th><th class="text-left p-3">Status</th><th class="text-left p-3">Detalhes</th></tr></thead><tbody>${logs.cobranca.slice(-50).reverse().map(l=>`<tr class="border-b hover:bg-[#F9FAFB]"><td class="p-3">${l.dataHora||l.data||''}</td><td class="p-3 font-medium">${l.clienteId||''}</td><td class="p-3">${l.tipo||''}</td><td class="p-3">${l.status||''}</td><td class="p-3 text-[10px] text-[#6B7280]">${l.detalhes||''}</td></tr>`).join('')||'<tr><td colspan="5" class="p-8 text-center text-[#6B7280]">Nenhum registro</td></tr>'}</tbody></table></div></div>`;
    main.innerHTML=''; main.appendChild(page);
    page.querySelector('#zm-logs-voltar').addEventListener('click',()=> location.reload());
    page.querySelector('#zm-log-export').addEventListener('click',()=>{ let csv='data,cliente,tipo,status,detalhes\n'; logs.cobranca.forEach(l=>{ csv+=`"${l.dataHora||''}","${l.clienteId||''}","${l.tipo||''}","${l.status||''}","${(l.detalhes||'').replace(/"/g,'""')}"\n`; }); let blob=new Blob([csv],{type:'text/csv'}); let url=URL.createObjectURL(blob); let a=document.createElement('a'); a.href=url; a.download=`auditoria-${new Date().toISOString().slice(0,10)}.csv`; a.click(); });
  }
  const obs=new MutationObserver(()=>{ criarGuia(); }); obs.observe(document.body,{childList:true, subtree:true});
  setInterval(criarGuia,3000); setTimeout(criarGuia,1500);
})();

console.log('ZIULEX FINAL 100% - 25 itens - Completo');
})();
</script>
