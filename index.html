
<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>TESTE SUPABASE ZIULEX</title></head>
<body style="font-family:monospace;padding:20px;background:#0f172a;color:#fff;">
<h1>TESTE CONEXAO SUPABASE ZIULEX</h1>
<p>URL: https://bfqkcsgdnpxrwkyupls.supabase.co</p>
<p id="status">Testando...</p>
<pre id="log" style="background:#000;padding:12px;white-space:pre-wrap;"></pre>
<button onclick="testar()" style="padding:10px 20px;font-weight:bold;">CLICAR PARA TESTAR CONEXAO</button>

<script>
const URL="https://bfqkcsgdnpxrwkyupls.supabase.co";
const KEY="sb_publishable_5NeAhUNLMZ-UNya14PT_Tw_G9Q4qx0F";
const logEl = document.getElementById('log');
function log(m){ logEl.textContent+=m+"\n"; console.log(m); }

async function testar(){
  logEl.textContent="";
  document.getElementById('status').textContent="Testando...";
  log("1. Testando SELECT em clientes...");
  try{
    let r = await fetch(URL+"/rest/v1/clientes?select=*&limit=5", {headers:{"apikey":KEY,"Authorization":"Bearer "+KEY}});
    let txt = await r.text();
    log("SELECT status: "+r.status);
    log("SELECT resposta: "+txt.slice(0,500));
    if(!r.ok) log("❌ ERRO SELECT - verifique RLS ou KEY");
    else log("✅ SELECT OK!");
  }catch(e){ log("❌ Erro fetch SELECT: "+e); }

  log("\n2. Testando INSERT...");
  const id = "teste-"+Date.now();
  try{
    let r = await fetch(URL+"/rest/v1/clientes", {
      method:"POST",
      headers:{"apikey":KEY,"Authorization":"Bearer "+KEY,"Content-Type":"application/json","Prefer":"return=representation"},
      body: JSON.stringify({id, nome:"TESTE CONEXAO "+new Date().toLocaleTimeString(), cpf:"000", email:"teste@teste.com", telefone:"00", escritorio:"Matriz"})
    });
    let txt = await r.text();
    log("INSERT status: "+r.status);
    log("INSERT resposta: "+txt.slice(0,800));
    if(r.ok) log("✅ INSERT OK! Vai no Table Editor > clientes e veja TESTE CONEXAO");
    else log("❌ ERRO INSERT - RLS ainda bloqueando ou KEY errada");
  }catch(e){ log("❌ Erro fetch INSERT: "+e); }

  log("\n3. Testando se KEY é valida...");
  log("KEY usada: "+KEY.slice(0,30)+"...");
}
testar();
</script>
</body></html>
